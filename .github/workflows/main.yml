name: Nginx CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Запуск автотестов
        run: ./test.sh

      - name: Сборка Docker-образа
        run: docker build -t my-nginx-app:latest .
