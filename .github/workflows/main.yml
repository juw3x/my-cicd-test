name: Docker CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-docker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Сборка Docker-образа
        run: docker build -t my-cicd-app:latest .

      - name: Проверка наличия образа
        run: docker image ls | grep my-cicd-app
