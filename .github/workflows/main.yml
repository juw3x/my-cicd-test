name: Nginx Integration Test

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Сборка Docker-образа
        run: docker build -t my-nginx-app:latest .

      - name: Поднятие тестового контейнера
        run: docker run -d -p 8080:80 --name test-nginx my-nginx-app:latest

      - name: Ожидание старта сервера
        run: sleep 2

      - name: Запуск curl-теста
        run: ./test.sh

      - name: Очистка (Удаление контейнера)
        if: always() 
        run: docker rm -f test-nginx
